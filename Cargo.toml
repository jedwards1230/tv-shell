# Virtual workspace manifest for tv-shell's Rust crates.
#
# Four crates, one lockfile, shared dependency versions:
#   - daemon/    tv-shell-input    — Linux/cec/mcp input daemon (UNTOUCHED machinery)
#   - host/      tv-shell-host     — cross-platform Steam-library sidecar (axum)
#   - protocol/  tv-shell-protocol — shared /library wire types (serde only)
#   - panel/     tv-shell-panel    — LAN web control panel (axum + askama)
#   - core/      tv-shell-core     — v2 core: gamescope base-layer policy (BESIDE daemon/,
#                                  never instead of it; see docs/V2_DESIGN.md §11)
#
# Why a workspace (not two independent crates, not one crate w/ two bins): one
# lockfile + shared dep versions; the `protocol` crate is the single source of
# truth for the `/library` JSON shape (prevents daemon↔host drift); separate
# crates keep the host's graph pure-Rust on Win/Mac (the daemon's
# evdev/zbus/bluer/cec Linux deps never reach it). All cargo commands are
# `-p`-scoped so neither binary compiles the other.
[workspace]
resolver = "2"
members = ["daemon", "host", "protocol", "panel", "core"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
# Object-safe async traits — the panel's `NodeTransport` is held as
# `Arc<dyn NodeTransport>`, and native `async fn` in traits is not yet
# dyn-compatible. Already in the lockfile as a transitive dep.
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# `multipart` powers the panel's wallpaper upload (the panel is the only member
# that needs it; the feature is additive and harmless for the host sidecar).
axum = { version = "0.8", features = ["multipart"] }
subtle = "2"
keyvalues-parser = "0.2"
askama = "0.16"
tv-shell-protocol = { path = "protocol" }

# Applies to every workspace binary (daemon/host/panel) — a virtual workspace
# manifest is the only place a [profile] table can live, so this isn't
# panel-only despite landing alongside the panel's UI-polish pass. Keeps
# symbol names (no `strip = "symbols"`) so backtraces stay readable; only
# debug info is dropped. `lto = "thin"` trims binary size for a modest,
# incremental-build-friendly compile-time cost (full LTO wasn't worth the
# tradeoff here).
[profile.release]
strip = "debuginfo"
lto = "thin"

# ---------------------------------------------------------------------------
# TEMPORARY: rumqttc's rustls-webpki pin, bumped off the vulnerable 0.102.8.
#
# rumqttc 0.25.1 (the latest release, and upstream `main`) declares
# `rustls-webpki = "0.102.8"` DIRECTLY — not through rustls. That copy carries
# four open advisories: GHSA-82j2-j2ch-gfr8 (high, DoS via panic on a malformed
# CRL BIT STRING), GHSA-pwjx-qhcg-rvj4 (medium), and GHSA-xgp8-3hg3-c2mh +
# GHSA-965h-392x-2mh5 (low, name-constraint handling). This matters because the
# deployed daemon connects with `mqtts://`, so TLS certificate verification is
# genuinely exercised on every connection.
#
# It cannot be fixed from a manifest here: `^0.102.8` does not admit 0.103.x, so
# a `[patch.crates-io]` on rustls-webpki ITSELF silently re-points the
# already-patched 0.103 edge and leaves this one alone (tried; confirmed). The
# pin has to move inside rumqttc, so this patches rumqttc.
#
# The fork is one line — rumqttc uses exactly one item from the crate,
# `webpki::Error` in the `Error::WebPki` variant of its src/tls.rs, and that
# type is unchanged across 0.102 -> 0.103, so it needs no source changes.
#
# Upstream PR (the real fix): bytebeamio/rumqtt#1072
#
# REMOVE THIS ENTIRE BLOCK once a rumqttc release carries the bump: drop the
# `[patch.crates-io]` table, run `cargo update -p rumqttc`, and confirm with
#   cargo tree -p tv-shell-input -i rustls-webpki@0.102.8   (must find nothing)
# The pin is a commit SHA, not a branch, so the build is reproducible and the
# fork cannot move under CI.
#
# Full reasoning, and the evidence for each dead end: docs/MQTT.md
# § TLS transport and the rustls-webpki pin.
# ---------------------------------------------------------------------------
[patch.crates-io]
rumqttc = { git = "https://github.com/jedwards1230/rumqtt", rev = "6aa9f85ce286881109c67ce716cfb2facdbbfc40" }
