# Rust CI for the tv-shell Linux Rust crates: the input daemon (daemon/), the web
# control panel (panel/), the v2 core (core/), and the v2 AV-control daemon (cec/).
#
# Builds, formats, lints, and tests the daemon crate on a Linux runner — the only
# place the evdev/uinput code compiles (it is excluded on non-Linux dev hosts).
# Runs inside a slim official `rust` container (toolchain preinstalled, ~1.5 GB
# vs the ~30 GB ubuntu-latest image; no system libs needed — evdev is pure Rust).
#
# Since the repo is a Cargo workspace (daemon/ + host/ + protocol/ + panel/ +
# core/ + cec/), every cargo command is `-p`-scoped so no crate's graph leaks into
# another's build — the host crate (cross-platform, CI'd separately in host.yml)
# is never dragged into the daemon's Linux/cec build, and the daemon's
# evdev/zbus/bluer/cec graph never reaches the pure-Rust panel, core and cec legs
# (and the cec crate's own `linux-cec` never reaches theirs). The
# workspace shares one target dir at the repo ROOT, so the build output is at
# `../target/release/...` from `working-directory: daemon`.
#
# Two jobs run OUTSIDE the container on the bare runner VM: `core-uinput`, which
# needs a real /dev/uinput (blocking — the leg has proved it can execute on a
# hosted runner, see the comment above that job), and `cec-mutants`, which needs
# cargo-mutants + jq and exists so the `cec` container job can keep installing
# nothing at all.
#
# Invoked by the CI orchestrator (.github/workflows/ci.yml), which decides via
# path-based change detection whether the daemon/protocol crates changed, so
# QML-only PRs never reach this workflow. ci.yml is the single required-check
# surface.

name: Rust

run-name: "Rust CI — ${{ github.event_name }} on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
    inputs:
      cec-mutants:
        description: >-
          Whether to run the `cec-mutants` job. The caller (ci.yml) sets this
          from a filter narrower than the broad `rust` area, because the
          mutation result can only move when the cec crate, its scope config or
          its runner script changes.
        type: boolean
        required: false
        # FAILS SAFE. An unset input must mean "run", never "skip": a caller
        # that forgets to pass this must get the measurement, not a silent hole.
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: daemon

jobs:
  build:
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bluer (BlueZ binding) pulls in libdbus-sys, which needs the system
      # libdbus headers + pkg-config at build time. zbus is pure-Rust and needs
      # nothing. the gaming client has libdbus at runtime (dbus is core on Arch).
      - name: Install D-Bus build deps
        run: apt-get update && apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Add rustfmt + clippy
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .

      - name: Format check
        id: fmt
        run: cargo fmt --check -p tv-shell-input

      - name: Clippy
        id: clippy
        run: cargo clippy -p tv-shell-input --all-targets -- -D warnings

      - name: Build
        id: build
        run: cargo build --release -p tv-shell-input

      - name: Test
        id: test
        run: cargo test -p tv-shell-input

      # Acceptance gate: the TLS/crypto graph must stay pure Rust (rustls +
      # ring). The `ldd` assertion in the `cec` job below only greps for
      # libcec/libp8-platform, so it would sail straight past a crypto-provider
      # regression — e.g. a dependency pulling rustls via its DEFAULT features
      # and dragging in aws-lc-rs (cmake + a C toolchain) with it.
      - name: Assert pure-Rust TLS graph
        id: tls
        run: ../scripts/assert-pure-rust-tls.sh -p tv-shell-input

      - name: Summary
        if: always()
        run: |
          {
            echo "## Rust CI — \`daemon/\`"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Format | ${{ steps.fmt.outcome }} |"
            echo "| Clippy | ${{ steps.clippy.outcome }} |"
            echo "| Build (release) | ${{ steps.build.outcome }} |"
            echo "| Test | ${{ steps.test.outcome }} |"
            echo "| Pure-Rust TLS | ${{ steps.tls.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # tv-shell-panel (panel/) is a separate workspace member: a pure-Rust web
  # control panel (axum/askama/reqwest-rustls) with NO system C libs (no libdbus,
  # no libudev, no pkg-config) and no cec/mcp-style Cargo features. It does NOT
  # use the file-level `defaults.run.working-directory: daemon` above — this job
  # overrides that to the repo root so `-p tv-shell-panel` (which resolves from
  # anywhere in the workspace) and the release binary path line up without the
  # daemon-relative default getting in the way.
  panel:
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add rustfmt + clippy
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .
          key: panel

      - name: Format check
        id: fmt
        run: cargo fmt --check -p tv-shell-panel

      - name: Clippy
        id: clippy
        run: cargo clippy -p tv-shell-panel --all-targets -- -D warnings

      - name: Build
        id: build
        run: cargo build --release -p tv-shell-panel

      - name: Test
        id: test
        run: cargo test -p tv-shell-panel

      - name: Summary
        if: always()
        run: |
          {
            echo "## Rust CI — \`panel/\`"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Format | ${{ steps.fmt.outcome }} |"
            echo "| Clippy | ${{ steps.clippy.outcome }} |"
            echo "| Build (release) | ${{ steps.build.outcome }} |"
            echo "| Test | ${{ steps.test.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The v2 core (core/, `tv-shell-core`). Pure Rust like the panel — x11rb needs
  # no libxcb/libX11 — so the BUILD needs no system libraries. The apt step below
  # is for the TESTS (an X server to round-trip atoms against) and for
  # shellchecking the session scripts, not for linking.
  # `-p`-scoped like every sibling, so the daemon's Linux-only graph
  # (evdev/zbus/bluer/cec) never reaches this build.
  core:
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add rustfmt + clippy
        run: rustup component add rustfmt clippy

      # Xvfb is the ONLY system dependency this job has, and it exists so the
      # nine integration tests in core/tests/atoms_xvfb.rs actually execute. They
      # used to run nowhere: this job is deliberately hermetic and no developer
      # box here has Xvfb either, so a test suite that gates on TV_SHELL_TEST_XVFB
      # was compiled everywhere and run in neither place. A test that runs
      # nowhere is not a test. shellcheck comes from the same apt call for the
      # session scripts below.
      # x11-utils is here for `xdpyinfo`, which the readiness check below uses to
      # prove the server ACCEPTS CONNECTIONS rather than merely that its socket
      # file exists.
      - name: System dependencies (Xvfb for the atom round-trips, shellcheck)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb x11-utils shellcheck

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .
          key: core

      - name: Format check
        id: fmt
        run: cargo fmt --check -p tv-shell-core

      - name: Clippy
        id: clippy
        run: cargo clippy -p tv-shell-core --all-targets -- -D warnings

      - name: Build
        id: build
        run: cargo build --release -p tv-shell-core

      # The default run: pure unit tests, no X server touched.
      - name: Test
        id: test
        run: cargo test -p tv-shell-core

      # The `#[ignore]`d atom round-trips against a real X server. Xvfb is
      # started here rather than via `xvfb-run` so the display number is explicit
      # and matches what the tests' own doc comment tells a developer to run.
      #
      # These PANIC rather than skip when TV_SHELL_TEST_XVFB is unset (see the
      # file header), so a broken server surfaces as a failure — the step cannot
      # pass by quietly running nothing.
      #
      # `--test-threads=1` IS REQUIRED, NOT TUNING. All nine tests share ONE
      # Xvfb and four of them write ROOT-window properties, while
      # `screen_state_assembles_from_real_server_bytes` reads whole-root state —
      # so in parallel it races every writer, and nine simultaneous connection
      # handshakes against one server is where it actually broke (a
      # `failed to read whole buffer` mid-handshake, i.e. a HARNESS failure
      # wearing a test's name). DO NOT REMOVE IT: the flakiness comes back
      # intermittently, which is worse than a red build because it trains people
      # to hit re-run. The tests also take a process-wide lock of their own
      # (`X_SERVER` in core/tests/atoms_xvfb.rs) so a developer running them by
      # hand gets the same guarantee; this flag states the constraint here too.
      #
      # Readiness waits on an actual CONNECTION (`xdpyinfo`), not on
      # /tmp/.X11-unix/X99 existing: the socket file appears before Xvfb accepts
      # connections, so the old path check let cargo start against a server that
      # was not listening yet. And if Xvfb never comes up — or dies — this fails
      # naming XVFB, rather than letting the failure present as a confusing
      # client-side error inside a test.
      - name: Test (Xvfb atom round-trips)
        id: test_xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 50); do
            if ! kill -0 "$xvfb_pid" 2>/dev/null; then
              echo "::error::Xvfb exited during startup — the X server is not available, so the atom round-trips cannot run."
              exit 1
            fi
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Xvfb did not accept a connection on :99 within 10s — failing here rather than letting cargo report it as a test error."
            exit 1
          fi
          TV_SHELL_TEST_XVFB=:99 \
            cargo test -p tv-shell-core --test atoms_xvfb -- --ignored --test-threads=1
        env:
          DISPLAY: ":99"

      # C2: the v2 session scripts were shellchecked by nothing. `gamescope.yml`
      # covers dev/gamescope/ only, and these ship as part of the core.
      #
      # scripts/install-v2.sh joins them: it is v2's installer, it is what the
      # install tests above execute, and no other job lints it.
      #
      # scripts/install.sh — v1's installer — joins them here too. It was
      # shellchecked by NO workflow, which is the worse gap of the two: v1 is
      # what still boots the couch on a v2 rollback, so it is the script whose
      # breakage has nowhere to fall back to. It is linted (not tested) in this
      # job because this is the only job that already has shellcheck installed;
      # nothing about the check is v2-specific.
      - name: Shellcheck the session scripts and both installers
        id: shellcheck
        run: |
          shellcheck --version
          shellcheck -x core/units/*.sh scripts/install-v2.sh scripts/install.sh
          for f in core/units/*.sh scripts/install-v2.sh scripts/install.sh; do bash -n "$f"; done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Rust CI — \`core/\`"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Format | ${{ steps.fmt.outcome }} |"
            echo "| Clippy | ${{ steps.clippy.outcome }} |"
            echo "| Build (release) | ${{ steps.build.outcome }} |"
            echo "| Test | ${{ steps.test.outcome }} |"
            echo "| Test (Xvfb) | ${{ steps.test_xvfb.outcome }} |"
            echo "| Shellcheck | ${{ steps.shellcheck.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # tv-shell-cec (cec/, `tv-shell-cec`): the v2 AV-control daemon. Pure Rust
  # like the panel and the core — `linux-cec-sys` ships PRE-GENERATED bindings,
  # so there is no bindgen, no libclang and no system libcec anywhere in this
  # graph, and the job therefore needs no apt step at all. That is the whole
  # reason this crate can exist beside the v1 daemon's `cec` feature without
  # re-opening the static-libcec argument (#179).
  #
  # `-p`-scoped like every sibling, so the daemon's Linux-only graph never
  # reaches this build and this crate's `linux-cec` never reaches theirs.
  #
  # THERE IS NO DEVICE-BACKED LEG HERE, deliberately. The runner has no
  # /dev/cecN, and an `#[ignore]`-gated test wired into no job defends nothing
  # (jedwards1230/tv-shell#469) — `continue-on-error` reports green on a SKIP as
  # readily as on a failure. The crate is written so the rules are covered
  # WITHOUT a device: config parsing, the wire grammar, the observation fold and
  # the `unknown`-is-never-`false` rule are all pure, and the IPC surface runs
  # end-to-end against a fake backend over a real Unix socket. The device-backed
  # lane lands with something that needs one to assert.
  cec:
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add rustfmt + clippy
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .
          key: cec

      - name: Format check
        id: fmt
        run: cargo fmt --check -p tv-shell-cec

      - name: Clippy
        id: clippy
        run: cargo clippy -p tv-shell-cec --all-targets -- -D warnings

      - name: Build
        id: build
        run: cargo build --release -p tv-shell-cec

      - name: Test
        id: test
        run: cargo test -p tv-shell-cec

      # Acceptance gate, half one of two: the DEPENDENCY GRAPH.
      #
      # The job header above claims this crate needs no apt step because
      # `linux-cec-sys` ships pre-generated bindings. Until now nothing asserted
      # it, so the claim held BY ACCIDENT: a future `linux-cec` bump that
      # switched to bindgen would stay green on a GitHub runner that happens to
      # have libclang installed, and then fail on the deploy box. Same
      # `cargo tree --invert` mechanism as the daemon's TLS gate — success is
      # the failure condition — over a different banned list.
      - name: Assert no C toolchain in the dependency graph
        id: graph
        run: ./scripts/assert-no-system-c.sh graph -p tv-shell-cec

      # Half two: WHAT ACTUALLY GOT LINKED. The graph check catches a build-dep
      # appearing; this catches a system library bound through a path the banned
      # list does not name. It is an ALLOWLIST — the `cec-mcp` job's
      # `libcec|libp8-platform` grep is a denylist and would sail straight past a
      # new, unanticipated library, which is exactly the regression class here.
      - name: Assert no system libraries linked
        id: ldd
        run: ./scripts/assert-no-system-c.sh ldd target/release/tv-shell-cec

      - name: Summary
        if: always()
        run: |
          {
            echo "## Rust CI — \`cec/\`"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Format | ${{ steps.fmt.outcome }} |"
            echo "| Clippy | ${{ steps.clippy.outcome }} |"
            echo "| Build (release) | ${{ steps.build.outcome }} |"
            echo "| Test | ${{ steps.test.outcome }} |"
            echo "| No C toolchain (graph) | ${{ steps.graph.outcome }} |"
            echo "| No system libs (ldd allowlist) | ${{ steps.ldd.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Mutation testing over the PURE DECISION MODULES of cec/ (scope + rationale:
  # .cargo/mutants.toml; runner: scripts/run-cec-mutants.sh).
  #
  # WHY IT EXISTS. Mutation discipline on this crate is manual today and has
  # already failed twice: three tests in jedwards1230/tv-shell#514 were vacuous
  # until a hand-run mutation caught them — and fixing them exposed a real bug,
  # where `Rx` reset the whole tx-error run and made the "no rx traffic in the
  # same window" condition dead code — while inverting a crate's central rule in
  # jedwards1230/tv-shell#462 left all 88 tests passing. A discipline that has
  # failed twice should be automated.
  #
  # ADVISORY, BUT NOT `continue-on-error`. Surviving mutants are reported and do
  # not fail the job; the baseline has to exist before it can be a threshold.
  # But `continue-on-error` reports green on a SKIP as readily as on a failure,
  # which is precisely jedwards1230/tv-shell#469. So the script keeps the three
  # outcomes apart itself and exits NON-ZERO when it examined nothing, generated
  # no mutants, or could not parse the report — "we could not measure" must
  # never look like "we measured and it was fine".
  #
  # WHY ITS OWN JOB, ON THE BARE RUNNER. It needs cargo-mutants and jq, and the
  # `cec` job's whole point is that it installs nothing — keeping the two apart
  # preserves that property, and keeps a slow advisory run off the critical
  # path of the blocking one. Same shape as `core-uinput` above.
  cec-mutants:
    # SKIPPED IS NOT GREEN, AND IT IS NOT `continue-on-error`. A job-level `if:`
    # renders as a visible "Skipped" row in the PR checks list — the reader sees
    # that no measurement was taken. `continue-on-error` is categorically
    # different: it reports GREEN on a skip as readily as on a failure, which is
    # exactly jedwards1230/tv-shell#469, where a gated leg was wired to nothing
    # and read as passing for months. Do not "simplify" this into one.
    #
    # The input defaults to `true`, so an unset value RUNS the job. The only way
    # to skip is for the caller to have evaluated its filter and decided nothing
    # in scope changed.
    #
    # WHAT THIS DOES NOT DO: a path filter cannot tell a comments-only edit from
    # a logic edit, so any touch inside `cec/src/**` — a reworded doc comment
    # included — still runs the full ~9 minutes. The saving is on docs-only,
    # panel-only and daemon-only PRs, which previously paid for a measurement
    # that could not have moved.
    if: inputs.cec-mutants
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .
          key: cec-mutants

      - name: Install cargo-mutants
        id: install
        run: |
          cargo install cargo-mutants --locked
          cargo mutants --version

      # The script owns the pass/fail decision — see its header for the three
      # outcomes it keeps apart, and why it fails hard on the third.
      - name: Mutation test the cec decision modules
        id: mutants
        run: ./scripts/run-cec-mutants.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### cargo-mutants job steps"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Install cargo-mutants | ${{ steps.install.outcome }} |"
            echo "| Mutation run | ${{ steps.mutants.outcome }} |"
            echo ""
            echo "Surviving mutants are ADVISORY. A failure here means the run could"
            echo "not be measured at all (examined nothing / no mutants / unparsable)."
          } >> "$GITHUB_STEP_SUMMARY"

  # The uinput leg for core/tests/input_uinput.rs — four `#[ignore]`d tests keyed
  # on TV_SHELL_TEST_UINPUT that landed in #466 and, until this job, ran nowhere.
  #
  # WHY IT EXISTS. The invariant they defend is the presenter slot-order check in
  # core/src/input/evdev_backend.rs. That check was originally a
  # `debug_assert_eq!` — which compiles out of exactly the release build the
  # couch runs — and `emit` indexes presenters by slot, so a violation silently
  # routes one player's input to another player's device. #466 turned it into a
  # runtime `Err`. Reverting it to `debug_assert_eq!` and running
  # `cargo test -p tv-shell-core --lib` in BOTH debug and release passes in both:
  # the only test that catches it, `creating_presenters_out_of_order_is_refused`,
  # lives in this ignore-gated file. So this bug class — already hit once — had
  # zero automated defenders while the file sat unwired.
  #
  # WHY IT IS BLOCKING NOW. Whether a GitHub runner can `modprobe uinput`, and
  # whether the /dev/input/eventN node the kernel then publishes is readable by
  # the process running the tests, had to be OBSERVED, not assumed — #466's
  # author declined to wire it for precisely that reason, naming the precedent:
  # assuming it is how the Xvfb tests spent months compiled everywhere and run
  # nowhere. So this job landed in #469 as advisory (continue-on-error) with the
  # instruction to flip it once it had a run history. The observation is in: the
  # leg ran 8 times between 2026-09-08 and 2026-09-09, all green. `sudo modprobe
  # uinput` succeeds on `ubuntu-latest`, and the compile-as-user /
  # execute-under-sudo split below covers both permissions. It is therefore
  # blocking, as that instruction said — the run history it was waiting on
  # exists, so it is no longer a green-by-assumption check.
  #
  # WHY IT IS ITS OWN JOB AND NOT A STEP IN `core`. `core` runs inside the
  # `rust:1-bookworm` container. GitHub container jobs are neither privileged nor
  # given a mapped /dev/uinput, so `modprobe` has no CAP_SYS_MODULE and the device
  # node is not present to begin with — a step added there could not execute,
  # which is the exact failure this job exists to end. This leg therefore runs on
  # the bare runner VM (passwordless sudo, real kernel).
  core-uinput:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .
          key: core-uinput

      # Fail HERE, naming uinput, if the module cannot be loaded — rather than
      # letting a missing device present as a confusing panic inside a test.
      # Same shape as the Xvfb leg's readiness check in the `core` job.
      - name: Load the uinput module
        id: modprobe
        run: |
          if ! sudo modprobe uinput; then
            echo "::error::modprobe uinput failed — this runner cannot load the module, so the uinput tests cannot run."
            exit 1
          fi
          if [ ! -e /dev/uinput ]; then
            echo "::error::uinput loaded but /dev/uinput does not exist — no device node to talk to."
            exit 1
          fi
          ls -l /dev/uinput

      # TWO permissions are needed, not one, and they fail differently — this is
      # the half that is easy to get wrong. Writing /dev/uinput is enough to
      # CREATE a presenter; it is NOT enough to read one back, because the
      # /dev/input/eventN the kernel publishes for it is plain `root:input 0660`
      # with no ACL, and `evdev::enumerate()` silently OMITS what it cannot open.
      # That surfaces as "the presenter must appear in an enumeration" — an
      # assertion failure a long way from its cause. (Measured on hardware by
      # #466's author; the test file's preflight documents it.)
      #
      # So the test binary is COMPILED as the runner user (keeping the cargo
      # cache and target dir owned by that user) and EXECUTED under sudo, where
      # both halves hold unconditionally. Relying on a udev rule to widen the
      # eventN mode would work only if udevd is managing these nodes on the
      # runner — one more thing to assume.
      - name: Build the uinput test binary
        id: build_test
        run: |
          bin=$(cargo test -p tv-shell-core --test input_uinput --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "input_uinput") | .executable' \
            | grep -v '^null$' | tail -1)
          if [ -z "$bin" ] || [ ! -x "$bin" ]; then
            echo "::error::could not locate the compiled input_uinput test binary"
            exit 1
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # `--test-threads=1` mirrors the Xvfb leg: these tests each create real
      # uinput devices against one shared kernel and assert on what /dev/input
      # enumeration then shows, so concurrent creation makes every enumeration
      # assertion a race against the other tests' devices.
      #
      # The suite PANICS rather than skips when TV_SHELL_TEST_UINPUT is unset
      # while --ignored is passed (see the file header). That is deliberate and
      # must not be weakened: it is what makes this step incapable of passing by
      # quietly running nothing.
      - name: Test (uinput against the real kernel)
        id: test_uinput
        run: |
          sudo TV_SHELL_TEST_UINPUT=1 "${{ steps.build_test.outputs.bin }}" \
            --ignored --test-threads=1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Rust CI — \`core/\` uinput"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| modprobe uinput | ${{ steps.modprobe.outcome }} |"
            echo "| Build test binary | ${{ steps.build_test.outcome }} |"
            echo "| Test (uinput) | ${{ steps.test_uinput.outcome }} |"
            echo ""
            echo "Blocking: this leg ran green on hosted runners before being made required."
          } >> "$GITHUB_STEP_SUMMARY"

  # Separate leg for the OPTIONAL `cec` and `mcp` features (#94). Together they
  # are the set the deploy actually ships — scripts/build-daemon.sh and
  # scripts/install.sh both default TV_SHELL_FEATURES to "cec,mcp" — so this leg
  # is what keeps the shipped feature graph honest. The default `build` job
  # above stays C-free; this job exercises the libcec link. The `cec` feature
  # forwards `libcec-sys/static` (#179), so libcec-sys STATIC-links a prebuilt
  # libcec + p8-platform into the binary (fetched from ssalonen/libcec-static-
  # builds) instead of dynamically linking the system libcec — the same build
  # the deploy host ships. Keeping it separate preserves the no-system-C-deps
  # invariant for the default build.
  #
  # Runs on Debian Trixie (glibc 2.41), NOT bookworm (glibc 2.36): the prebuilt
  # static libcec.a references the glibc ≥2.38 C23 symbols `__isoc23_sscanf` /
  # `__isoc23_strtoul`, so linking it on bookworm fails with "undefined symbol".
  # The deploy host (gaming-client / CachyOS) has glibc 2.43, so Trixie matches
  # the runtime target. The default `build` job stays on bookworm (it never links
  # libcec).
  cec-mcp:
    runs-on: ubuntu-latest
    container: rust:1-trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Static libcec (#179) needs NO system libcec-dev / libclang / cmake: it
      # downloads a prebuilt static archive (no bindgen — libcec-sys ships
      # pre-generated bindings). It only needs the udev dev symlink + pkg-config
      # for the libudev link hint; libdbus is still required by bluer (the
      # feature build is a superset of the default Linux build).
      - name: Install CEC + D-Bus build deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            libudev-dev libdbus-1-dev pkg-config

      - name: Add clippy
        run: rustup component add clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: .
          key: cec

      # `mcp` rides along with `cec` rather than getting its own job: this is
      # the feature set that scripts/build-daemon.sh and scripts/install.sh
      # actually deploy (TV_SHELL_FEATURES defaults to "cec,mcp"), so testing
      # them together is testing what ships. mcp needs no extra system libs.
      #
      # Before this, `mcp` was compiled by NO job here and only ever built (not
      # tested) by release-input.yml — which runs on push to main, i.e. AFTER
      # merge. daemon/src/mcp.rs's tests ran nowhere automatically, so a break
      # there passed ci-gate green and first failed at ship time.
      - name: Clippy (--features cec,mcp)
        id: clippy
        run: cargo clippy -p tv-shell-input --features cec,mcp --all-targets -- -D warnings

      - name: Build (--features cec,mcp)
        id: build
        run: cargo build --release -p tv-shell-input --features cec,mcp

      - name: Test (--features cec,mcp)
        id: test_mcp
        run: cargo test -p tv-shell-input --features cec,mcp

      # Acceptance gate (#179): the static build must NOT pull in the system
      # libcec.so / libp8-platform.so — those are bundled into the binary. The
      # workspace target dir is at the repo ROOT, so from working-directory:
      # daemon the binary is one level up at ../target/release/.
      - name: Assert no system libcec dependency
        id: ldd
        run: |
          BIN=../target/release/tv-shell-input
          echo "ldd $BIN:"
          ldd "$BIN" || true
          if ldd "$BIN" | grep -Eiq 'libcec|libp8-platform'; then
            echo "::error::tv-shell-input dynamically links system libcec/libp8-platform — static bundling (#179) regressed"
            exit 1
          fi
          echo "OK: no system libcec/libp8-platform dynamic dependency"

      # Same TLS/crypto gate as the default leg, but against the `cec` feature
      # graph — enabling a feature can pull a different set of transitive deps,
      # so the invariant has to be asserted per feature combination, not once.
      - name: Assert pure-Rust TLS graph (--features cec)
        id: tls
        run: ../scripts/assert-pure-rust-tls.sh -p tv-shell-input --features cec

      - name: Test (--features cec)
        id: test
        run: cargo test -p tv-shell-input --features cec

      - name: Summary
        if: always()
        run: |
          {
            echo "## Rust CI — \`daemon/\` (--features cec)"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Clippy (cec) | ${{ steps.clippy.outcome }} |"
            echo "| Build (cec, release) | ${{ steps.build.outcome }} |"
            echo "| No system libcec (ldd) | ${{ steps.ldd.outcome }} |"
            echo "| Test (cec) | ${{ steps.test.outcome }} |"
            echo "| Test (cec,mcp) | ${{ steps.test_mcp.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
